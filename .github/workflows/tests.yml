# Runs the fast test suite on every PR and push to master. Uses only the
# committed artifacts (ensemble.joblib, fighter_history.parquet) -- no raw
# data, scraping, or GPU. The multi-hour retrains can NOT run here (weak
# CPU-only runners, 6h job limit, no raw CSVs); see CLAUDE.md.
name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q test_pipeline_logic.py test_predict.py
